kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: idp
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Ingress is reachable on http://*.localtest.me:8080 (resolves to 127.0.0.1).
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
