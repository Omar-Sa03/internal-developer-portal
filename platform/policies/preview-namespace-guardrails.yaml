# Every preview namespace gets a quota and default limits, so a burst of
# open pull requests cannot starve the cluster.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: preview-namespace-guardrails
  annotations:
    policies.kyverno.io/title: Preview Namespace Guardrails
    policies.kyverno.io/category: Platform Standards
    policies.kyverno.io/subject: Namespace
spec:
  rules:
    - name: generate-resource-quota
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  idp.io/preview: 'true'
      generate:
        apiVersion: v1
        kind: ResourceQuota
        name: preview-quota
        namespace: '{{request.object.metadata.name}}'
        synchronize: true
        data:
          spec:
            hard:
              requests.cpu: 500m
              requests.memory: 512Mi
              limits.cpu: '1'
              limits.memory: 1Gi
              pods: '5'

    - name: generate-limit-range
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  idp.io/preview: 'true'
      generate:
        apiVersion: v1
        kind: LimitRange
        name: preview-defaults
        namespace: '{{request.object.metadata.name}}'
        synchronize: true
        data:
          spec:
            limits:
              - type: Container
                default:
                  cpu: 250m
                  memory: 256Mi
                defaultRequest:
                  cpu: 50m
                  memory: 64Mi
---
# Kyverno's background controller needs permission to create what it generates.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-generate-preview-guardrails
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: 'true'
    rbac.kyverno.io/aggregate-to-admission-controller: 'true'
rules:
  - apiGroups: ['']
    resources: [resourcequotas, limitranges]
    verbs: [create, update, patch, delete, get, list, watch]
