{% raw %}
name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    # "labeled" so adding the preview label builds the preview image right away
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  packages: write
  pull-requests: write
  # Upload Trivy results to code scanning (read by the portal's readiness score)
  security-events: write

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: pytest -v


  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ruff
        uses: astral-sh/ruff-action@v3
        with:
          src: "."


  filesystem-scan:
    name: Filesystem Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs


  preview-image:
    name: Build preview image
    needs:
      - test
      - lint

    # Previews are opt-in via the "preview" label, and never built for forks.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          # Argo CD deploys the PR head commit, so build exactly that commit.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> "${GITHUB_ENV}"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build and push preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}:pr-${{ github.event.pull_request.head.sha }}

      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: http://${{ github.event.repository.name }}-pr-${{ github.event.pull_request.number }}.localtest.me:8080
        run: |
          marker='<!-- idp-preview -->'
          body="${marker}
          ### Preview environment

          | | |
          |---|---|
          | URL | ${PREVIEW_URL} |
          | Commit | \`${HEAD_SHA:0:7}\` |
          | Namespace | \`pr-${PR_NUMBER}-${GITHUB_REPOSITORY#*/}\` |

          Argo CD deploys this commit within a couple of minutes. The environment is
          deleted when the PR is closed or the \`preview\` label is removed."

          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1)
          if [ -n "${existing}" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="${body}"
          else
            gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          fi


  build-and-publish:
    name: Build and Publish
    needs:
      - test
      - lint
      - filesystem-scan

    # Only publish images and update GitOps manifests from main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> "${GITHUB_ENV}"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}:${{ github.sha }}

      - name: Scan container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}:dev
            ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}:latest

      - name: Update image tag
        run: |
          yq e '.image.tag = "${{ github.sha }}"' -i helm/service/values.yaml

      - name: Create Pull Request for Image Tag
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update image tag to ${{ github.sha }}"
          branch: "update-image-tag-${{ github.sha }}"
          title: "chore: update image tag to ${{ github.sha }}"
          body: "Automated PR to update the deployment image tag to ${{ github.sha }}"
          add-paths: |
            helm/service/values.yaml
{% endraw %}
