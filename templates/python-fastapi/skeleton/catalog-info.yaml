apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.service_name }}
  description: ${{ values.service_name }} service
  annotations:
    github.com/project-slug: "${{ values.github_owner }}/${{ values.service_name }}"
    backstage.io/kubernetes-id: ${{ values.service_name }}
    backstage.io/kubernetes-namespace: ${{ values.service_name }}
    grafana/dashboard-selector: "tag:${{ values.service_name }}"
    backstage.io/techdocs-ref: dir:.
    # Golden path provenance, used for drift detection and upgrade pull requests.
    idp.io/template: python-fastapi-service
    idp.io/template-version: "${{ values.template_version }}"
    idp.io/environment: ${{ values.environment }}
spec:
  type: service
  lifecycle: development
  owner: group:default/${{ values.team }}
