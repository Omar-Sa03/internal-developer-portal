apiVersion: apps/v1

kind: Deployment

metadata:
  name: {{ "{{" }} .Release.Name {{ "}}" }}

  labels:
    app: {{ "{{" }} .Release.Name {{ "}}" }}

spec:
  replicas: {{ "{{" }} .Values.replicaCount {{ "}}" }}

  selector:
    matchLabels:
      app: {{ "{{" }} .Release.Name {{ "}}" }}

  template:
    metadata:
      labels:
        app: {{ "{{" }} .Release.Name {{ "}}" }}

    spec:
      containers:

        - name: {{ "{{" }} .Release.Name {{ "}}" }}

          image: "{{ "{{" }} .Values.image.repository {{ "}}" }}:{{ "{{" }} .Values.image.tag {{ "}}" }}"

          imagePullPolicy: {{ "{{" }} .Values.image.pullPolicy {{ "}}" }}

          ports:
            - containerPort: 8000

          resources:
            {{ "{{-" }} toYaml .Values.resources | nindent 12 {{ "}}" }}

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 10
            periodSeconds: 15