apiVersion: v1
kind: Service

metadata:
  name: {{ "{{" }} .Release.Name {{ "}}" }}

  labels:
    app: {{ "{{" }} .Release.Name {{ "}}" }}

spec:
  selector:
    app: {{ "{{" }} .Release.Name {{ "}}" }}

  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000

  type: ClusterIP