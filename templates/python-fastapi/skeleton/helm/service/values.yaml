replicaCount: 1

image:
  repository: ghcr.io/${{ values.github_owner | lower }}/${{ values.service_name }}
  tag: "dev"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: nginx
  host: ${{ values.service_name }}.localtest.me

metrics:
  serviceMonitor:
    enabled: true

# Set by the preview ApplicationSet (platform/argocd/appsets/previews.yaml).
preview:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 512Mi
