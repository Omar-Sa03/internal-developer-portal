apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: python-fastapi-service
  title: Python FastAPI Service
  description: Create a production-ready FastAPI service
  annotations:
    # Single source of truth for the golden path version (see CHANGELOG.md).
    # Bump it whenever the skeleton changes; generated services record the
    # version they were built from, and the readiness score flags drift.
    idp.io/template-version: &templateVersion 2.0.0
    # Template that opens upgrade pull requests for services built from this one.
    idp.io/upgrade-template: template:default/upgrade-python-fastapi-service

spec:
  owner: group:backend-team
  type: service

  parameters:

    - title: Service Information
      required:
        - serviceName
        - team
        - environment
        - githubOwner

      properties:

        serviceName:
          title: Service Name
          type: string
          description: Name of the new service
          pattern: '^[a-z0-9-]+$'
          ui:autofocus: true

        team:
          title: Team
          type: string
          description: Team responsible for the service
          default: backend-team

        environment:
          title: Environment
          type: string
          default: development
          enum:
            - development
            - staging
            - production

        githubOwner:
          title: GitHub Owner
          type: string
          default: internal-developer-portal26

  steps:

    - id: fetch
      name: Generate service
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: .

        values:
          service_name: ${{ parameters.serviceName }}
          team: ${{ parameters.team }}
          environment: ${{ parameters.environment }}
          github_owner: ${{ parameters.githubOwner }}
          template_version: *templateVersion

    - id: publish
      name: Create GitHub repository
      action: publish:github
      input:
        repoUrl: github.com?repo=${{ parameters.serviceName }}&owner=${{ parameters.githubOwner }}
        description: ${{ parameters.serviceName }} generated by the Internal Developer Platform
        defaultBranch: main
        repoVisibility: public
        # Lets the preview ApplicationSet discover this repository.
        topics:
          - idp-service

    - id: deploy
      name: Create Argo CD application
      action: argoCd:createApplication
      input:
        name: ${{ parameters.serviceName }}
        repoUrl: ${{ steps.publish.output.remoteUrl }}
        path: helm/service
        namespace: ${{ parameters.serviceName }}

    - id: register
      name: Register service
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:

    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}

      - title: Argo CD application
        url: http://argocd.localtest.me:8080/applications/argocd/${{ steps.deploy.output.applicationName }}

      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
