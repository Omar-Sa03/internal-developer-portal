apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: python-fastapi-service
  title: Python FastAPI Service
  description: Create a production-ready FastAPI service

spec:
  owner: group:backend-team
  type: service

  parameters:

    - title: Service Information
      required:
        - serviceName
        - team
        - environment
        - githubOwner

      properties:

        serviceName:
          title: Service Name
          type: string
          description: Name of the new service
          pattern: '^[a-z0-9-]+$'
          ui:autofocus: true

        team:
          title: Team
          type: string
          description: Team responsible for the service
          default: backend-team

        environment:
          title: Environment
          type: string
          default: development
          enum:
            - development
            - staging
            - production

        githubOwner:
          title: GitHub Owner
          type: string
          default: omar-sa03

    - title: Repository
      required:
        - repoUrl

      properties:

        repoUrl:
          title: Repository Location
          type: string
          description: GitHub repository to create
          default: github.com?repo={{ parameters.serviceName }}&owner={{ parameters.githubOwner }}
          pattern: '^github\.com\?.*'

  steps:

    - id: fetch
      name: Generate service
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: .

        values:
          service_name: ${{ parameters.serviceName }}
          team: ${{ parameters.team }}
          environment: ${{ parameters.environment }}
          github_owner: ${{ parameters.githubOwner }}

    - id: publish
      name: Create GitHub repository
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.serviceName }} generated by the Internal Developer Platform
        defaultBranch: main
        repoVisibility: public

    - id: register
      name: Register service
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:

    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}

      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
